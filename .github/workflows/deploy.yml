name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish PourCast/PourCast.csproj -c Release -r linux-x64 --self-contained false -o publish

      # usage.json holds today's API call counts, so it's kept between deploys.
      - name: Deploy
        run: |
          sudo systemctl stop PourCast.service
          rsync -a --delete --exclude usage.json publish/ /opt/pourcast/
          sudo systemctl start PourCast.service

      - name: Check
        run: |
          sleep 5
          sudo systemctl status PourCast.service --no-pager
          curl --fail --silent --show-error --output /dev/null http://localhost:7140/
